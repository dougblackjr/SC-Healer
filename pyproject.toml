[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-healer"
version = "0.1.0"
description = "Offline-first WordPress SC incident triage and controlled remediation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1.1,<2"]

[project.scripts]
sc-healer = "sc_healer.cli:main"

[tool.setuptools.packages.find]
include = ["sc_healer*"]

